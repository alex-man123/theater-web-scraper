# MySQL 8 pentru proiect, separat de orice instalare MySQL existentă (port 3307).
# Pornire:  docker compose up -d
# La prima pornire, MySQL creează baza MYSQL_DATABASE, utilizatorul MYSQL_USER
# și rulează automat db/schema.sql. Parolele se citesc din fișierul .env.
services:
  mysql:
    image: mysql:8.0
    container_name: odeon-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Setați MYSQL_ROOT_PASSWORD în .env}
      MYSQL_DATABASE: ${DB_NAME:-theater_crawler}
      MYSQL_USER: ${DB_USER:-odeon_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Setați DB_PASSWORD în .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - odeon-mysql-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/docker-test-db.sql:/docker-entrypoint-initdb.d/02-test-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  odeon-mysql-data:
