<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Repertoriu{% endblock %} · Teatrul Odeon (proiect)</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ url_for('index') }}">Odeon<span>repertoriu &amp; program</span></a>
      <nav aria-label="Navigare principală">
        <a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}aria-current="page"{% endif %}>Acasă</a>
        <a href="{{ url_for('shows') }}" {% if request.endpoint in ('shows', 'show_detail') %}aria-current="page"{% endif %}>Spectacole</a>
        <a href="{{ url_for('schedule') }}" {% if request.endpoint == 'schedule' %}aria-current="page"{% endif %}>Program</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      Proiect educațional Tehnologii Web. Datele provin din baza locală, colectate de pe
      <a href="https://teatrul-odeon.ro/" rel="noopener">teatrul-odeon.ro</a>; drepturile asupra textelor și afișelor aparțin Teatrului Odeon.
      Orele sunt afișate în ora României.
    </div>
  </footer>
</body>
</html>
